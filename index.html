<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Muhammad Asif | Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Loader -->
  <div id="loader">
    <svg id="bolt" viewBox="0 0 24 24" fill="#5ad1ff">
      <path d="M13 2 4 14h6l-1 8 9-12h-6z" />
    </svg>
    <h2 class="loader-title">Welcome To My Portfolio</h2>
    <div class="bar"><i id="fill"></i></div>
    <div id="pct" class="muted">0%</div>
  </div>

  <!-- Moving stars background -->
  <canvas id="stars"></canvas>

  <!-- Navbar -->
  <nav aria-label="Main">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#portfolio">Portfolio</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>

    <!-- Hero -->
    <section id="home" class="hero">
      <div>
        <p class="muted" id="role"></p>
        <h1>Turning Ideas<br>Into Reality</h1>
        <p class="muted" id="tagline"></p>
        <div class="btns">
          <a class="btn fill" href="#portfolio">Projects</a>
          <a class="btn" href="#contact">Contact me</a>
        </div>
        <div class="social" id="social"></div>
      </div>

      <div class="player" id="player">
        <div class="disc"></div>
        <div>
          <span class="muted">Daily rotation</span>
          <b>Midnight Orbit</b>
          <span class="muted">Lo-fi Station</span>
        </div>
        <button id="play" aria-label="Play or pause">▶</button>
      </div>
    </section>

    <!-- About -->
    <section id="about">
      <h2 id="hi"></h2>
      <div class="about">
        <div>
          <p id="bio"></p>
          <h2 class="small-title">Education &amp; experience</h2>
          <ul class="timeline" id="edu"></ul>
        </div>

        <div>
          <div class="photo has" id="photo" role="button" tabindex="0" aria-label="Tap to change photo style">
  <img id="img" src="photo.jpg" alt="Muhammad Asif">
          </div>
          <div class="hint">Tap the photo to switch to hero mode</div>
          <p class="hint">
            <label class="upload">
              Upload your photo
              <input type="file" id="file" accept="image/*" hidden>
            </label>
          </p>
        </div>
      </div>
    </section>

    <!-- Stats -->
    <section>
      <div class="stats" id="stats"></div>
    </section>

    <!-- Portfolio -->
    <section id="portfolio">
      <h2>Portfolio</h2>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="panel"></div>
    </section>

    <!-- Contact -->
    <section id="contact">
      <h2>Get in touch</h2>
      <div class="contact">

        <form id="form">
          <input id="cname" placeholder="Your name" required>
          <input id="cmail" type="email" placeholder="Email" required>
          <textarea id="cmsg" rows="4" placeholder="Message" required></textarea>
          <button class="btn fill" type="submit">Send message</button>
          <small class="muted" id="status"></small>
        </form>

        <div class="comments">
          <h3>Comments</h3>
          <input id="kname" placeholder="Your name">
          <textarea id="ktext" rows="2" placeholder="Leave a comment"></textarea>
          <button class="btn" id="kadd" type="button">Post comment</button>
          <div id="list"></div>
        </div>

      </div>
    </section>

  </main>

  <footer id="foot"></footer>

  <script src="script.js"></script>
</body>
</html>
